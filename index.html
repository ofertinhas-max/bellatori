<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branca Bellatori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-6px); }
      }
      .tut-pointer {
        position: fixed;
        top: 8px;
        right: 12px;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        animation: bounce 1.3s ease-in-out infinite;
      }
      .tut-pointer i {
        font-size: 1.2rem;
        color: #C4877A;
        filter: drop-shadow(0 2px 6px rgba(196,135,122,0.5));
      }
      .tut-pointer span {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        color: #C4877A;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="noise"></div>

    <!-- Seta pulsando no canto superior direito, apontando para os ⋯ do TikTok -->
    <div class="tut-pointer">
      <i class="fas fa-arrow-up"></i>
      <span>⋯</span>
    </div>

    <div class="container">

      <div class="profile">
        <div class="profile-frame">
          <div class="profile-img-wrap">
            <img src="images/logo.jpeg" alt="Branca Bellatori" />
          </div>
        </div>
        <h1>Branca Bellatori</h1>
        <div class="ornament">
          <span></span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 0L7.2 4.8L12 6L7.2 7.2L6 12L4.8 7.2L0 6L4.8 4.8L6 0Z" fill="currentColor"/>
          </svg>
          <span></span>
        </div>
      </div>

      <!-- Tutorial usando as classes de card já existentes -->
      <div class="links">

        <div class="link" style="cursor: default; pointer-events: none;">
          <div class="link-img" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#C4877A,#7D4F5C);">
            <span style="font-family:'DM Sans',sans-serif;font-size:1.5rem;font-weight:700;color:#fff;">1</span>
          </div>
          <div class="link-content">
            <span class="link-name">Toque nos <strong>⋯</strong> no canto superior direito da tela</span>
          </div>
          <div class="link-shine"></div>
        </div>

        <a href="/links" class="link">
          <div class="link-img" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#C4877A,#7D4F5C);">
            <span style="font-family:'DM Sans',sans-serif;font-size:1.5rem;font-weight:700;color:#fff;">2</span>
          </div>
          <div class="link-content">
            <span class="link-name">Selecione <strong>"Abrir no navegador"</strong></span>
            <span class="link-cta">Já estou no navegador <i class="fas fa-arrow-right"></i></span>
          </div>
          <div class="link-shine"></div>
        </a>

      </div>

      <div class="social-icons">
        <a href="https://www.instagram.com/brancabellatori" target="_blank" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@brancabellator" target="_blank" aria-label="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
