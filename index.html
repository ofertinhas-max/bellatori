<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branca Bellatori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="noise"></div>

    <!-- Seta fixa apontando para os ⋯ do TikTok -->
    <div class="tut-pointer">
      <i class="fas fa-arrow-up tut-pointer-icon"></i>
      <span class="tut-pointer-label">⋯</span>
    </div>

    <div class="container">

      <div class="profile">
        <div class="profile-frame">
          <div class="profile-img-wrap">
            <img src="images/logo.jpeg" alt="Branca Bellatori" />
          </div>
        </div>
        <h1>Branca Bellatori</h1>
        <div class="ornament">
          <span></span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 0L7.2 4.8L12 6L7.2 7.2L6 12L4.8 7.2L0 6L4.8 4.8L6 0Z" fill="currentColor"/>
          </svg>
          <span></span>
        </div>
      </div>

      <!-- Tutorial -->
      <div class="tut-card">
        <p class="tut-title">Para ver os produtos</p>
        <p class="tut-subtitle">Siga os passos abaixo para abrir no navegador:</p>
        <div class="tut-steps">
          <div class="tut-step">
            <span class="tut-num">1</span>
            <p>Toque nos <strong>⋯</strong> no canto superior direito da tela</p>
          </div>
          <div class="tut-step">
            <span class="tut-num">2</span>
            <p>Selecione <strong>"Abrir no navegador"</strong></p>
          </div>
        </div>
      </div>

      <a href="/links" class="tut-browser-link">
        Já estou no navegador <i class="fas fa-arrow-right"></i>
      </a>

      <div class="social-icons">
        <a href="https://www.instagram.com/brancabellatori" target="_blank" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@brancabellator" target="_blank" aria-label="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
